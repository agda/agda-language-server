# modified from https://github.com/simonmichael/hledger/blob/master/.github/workflows/linux.yml

name: CI

defaults:
  run:
    shell: bash

env:
  # Pinned exact Stack version: installed and verified on every platform,
  # and baked into the toolchain and compiled-dependency cache keys below.
  # Never 'latest'.
  STACK_VERSION: '3.3.1'

on:
  push:
    branches: [master]
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-cabal-drift:
    name: Check Cabal Drift
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 📥 Install hpack
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/sol/hpack/releases/download/0.38.3/hpack_linux.gz \
          | gunzip > "$HOME/.local/bin/hpack"
        chmod +x "$HOME/.local/bin/hpack"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: 🔄 Regenerate cabal file with hpack
      run: hpack

    - name: 🔍 Check for generated-file drift
      run: git diff --exit-code -- agda-language-server.cabal

    - name: 🏗 Setup Haskell
      uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
      with:
        ghc-version: '9.10.2'
        enable-stack: true
        stack-version: ${{ env.STACK_VERSION }}

    - name: 🔒 Check stack-*.yaml.lock drift (fails if Stack would rewrite it)
      run: |
        for f in stack-9.10.2-Agda-2.8.0.yaml stack-9.10.2-Agda-2.7.0.1.yaml stack-9.10.2-Agda-2.6.4.3.yaml; do
          echo "::group::${f}.lock"
          stack build --stack-yaml "$f" --dry-run --lock-file error-on-write
          echo "::endgroup::"
        done

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
        agda: ['Agda-2.8.0', 'Agda-2.7.0.1', 'Agda-2.6.4.3']
        # macos-15-intel (Intel Mac) runners are scarce and can sit queued
        # for 13+ minutes before starting, dominating PR feedback latency
        # for a job that then only takes ~3 minutes to actually run. Cut
        # PR runs down to one Agda version on that runner; push/tag events
        # (master, releases) still get the full 3-way matrix. The 'os'
        # value collapses to '' when not a pull_request, which matches no
        # real matrix entry, so nothing is excluded outside pull_request.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || '' }}
            agda: 'Agda-2.7.0.1'
          - os: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || '' }}
            agda: 'Agda-2.6.4.3'
      fail-fast: false
    steps:

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 📤 Install yq (Windows)
      if: runner.os == 'Windows'
      uses: frenck/action-setup-yq@v1
      with:
        # Unpinned 'latest' (the default) triggers an unauthenticated
        # curl to api.github.com to resolve the newest release, which
        # is vulnerable to shared-runner-IP anonymous rate limits.
        version: v4.53.6

    - name: 🎛️ Determine which version of Agda to target
      run: |
        STACK_YAML=$(echo stack-9.10.2-${{ matrix.agda }}.yaml)
        STACK_YAML_ARG="--stack-yaml $(echo stack-9.10.2-${{ matrix.agda }}.yaml)"

        # Determine artifact naming based on branch/tag
        if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
          PREFIX="als-dev"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          PREFIX="als-${{ github.ref_name }}"
        else
          PREFIX="als"
        fi

        if [[ ${{ matrix.os }} == "ubuntu-latest" ]]; then
          ARTEFACT="$PREFIX-${{ matrix.agda }}-ubuntu"
        fi
        if [[ ${{ matrix.os }} == "macos-latest" ]]; then
          ARTEFACT="$PREFIX-${{ matrix.agda }}-macos-arm64"
        fi
        if [[ ${{ matrix.os }} == "macos-15-intel" ]]; then
          ARTEFACT="$PREFIX-${{ matrix.agda }}-macos-x64"
        fi
        if [[ ${{ matrix.os }} == "windows-latest" ]]; then
          ARTEFACT="$PREFIX-${{ matrix.agda }}-windows"
        fi
        
        echo STACK_YAML_ARG="${STACK_YAML_ARG}" >> "${GITHUB_ENV}"
        echo STACK_YAML="${STACK_YAML}"         >> "${GITHUB_ENV}"
        echo ARTEFACT="${ARTEFACT}"             >> "${GITHUB_ENV}"

    - name: 🎛️ Determine Stack resolver & GHC version
      run: |
        STACK_RESOLVER=$(yq .resolver $STACK_YAML)
        GHC_VERSION=$(echo $(yq .compiler $STACK_YAML) | cut -c 5-)
        echo STACK_RESOLVER="${STACK_RESOLVER}" >> "${GITHUB_ENV}"
        echo GHC_VERSION="${GHC_VERSION}"       >> "${GITHUB_ENV}"

    # Redesigned cache boundaries:
    #  - The toolchain cache holds only the ghcup install directory
    #    (~/.ghcup on Linux/macOS, C:\ghcup on Windows), keyed by the
    #    pinned STACK_VERSION and GHC_VERSION (no Agda target -- shared
    #    across the three Agda entries for this OS/architecture). It is
    #    restored before Haskell setup so a hit lets setup skip
    #    downloading GHC and Stack, verified against the pinned versions
    #    afterward, and saved by the Agda 2.8.0 entry immediately after
    #    that verification -- independently of the snapshot/dependency
    #    builds below, so a setup or version-mismatch failure blocks the
    #    save but a later dependency-build failure cannot suppress it.
    #    Only the Agda 2.8.0 entry is allowed to save it, so the three
    #    parallel jobs for one OS/architecture never race to write the
    #    same key. haskell-actions/setup is pinned to a full commit SHA
    #    (not the mutable v2 tag) so its installer behavior can't
    #    silently change what a hit key was actually verified against.
    #  - The compiled-dependency cache holds only
    #    $STACK_ROOT/{snapshots,setup-exe-cache}, is Agda-specific (so
    #    each Agda entry owns its own key), and is keyed by every
    #    dimension that changes its compatibility (OS, arch, Stack, GHC,
    #    ICU ABI, resolver, Agda target) plus CONFIG_HASH, so that a
    #    prefix hit (only CONFIG_HASH differs) is only ever used when
    #    every other dimension is identical, and any other dimension
    #    changing yields a complete miss (the restore-keys prefix itself
    #    changes, so a differently-configured entry cannot match it).
    #  - No .stack-work caching: removed outright pending a future
    #    measurement showing a net wall-clock benefit.

    # ~/.ghcup is a symlink to /usr/local/.ghcup on GitHub-hosted Ubuntu
    # runners (pre-provisioned by the runner image); actions/cache archives
    # the symlink itself, not its target, so Linux must cache the real path
    # directly. macOS and Windows have no such indirection.
    - name: 💾 Restore Haskell toolchain cache (all platforms, shared across Agda targets, before setup)
      id: haskell-toolchain
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && 'C:\ghcup' || runner.os == 'Linux' && '/usr/local/.ghcup' || '~/.ghcup' }}
        key: ghcup-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ env.GHC_VERSION }}

    - name: 🏗 Setup Haskell (pinned Stack version, all platforms)
      uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
      with:
        ghc-version: ${{ env.GHC_VERSION }}
        enable-stack: true
        stack-version: ${{ env.STACK_VERSION }}

    - name: 🔍 Verify pinned Stack version
      run: |
        actual="$(stack --numeric-version)"
        echo "Stack version: ${actual}"
        if [[ "${actual}" != "${STACK_VERSION}" ]]; then
          echo "::error::expected pinned Stack ${STACK_VERSION}, got ${actual}"
          exit 1
        fi

    - name: 🔍 Verify pinned GHC version
      run: |
        actual="$(ghc --numeric-version)"
        echo "GHC version: ${actual}"
        if [[ "${actual}" != "${GHC_VERSION}" ]]; then
          echo "::error::expected pinned GHC ${GHC_VERSION}, got ${actual}"
          exit 1
        fi

    - name: 💾 Save Haskell toolchain cache (Agda 2.8.0 is the sole writer, right after setup+verification)
      if: >
        matrix.agda == 'Agda-2.8.0' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.haskell-toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && 'C:\ghcup' || runner.os == 'Linux' && '/usr/local/.ghcup' || '~/.ghcup' }}
        key: ${{ steps.haskell-toolchain.outputs.cache-primary-key }}

    - name: 🎛️ Determine Stack root
      run: |
        STACK_ROOT="$(stack path $STACK_YAML_ARG --stack-root)"
        echo STACK_ROOT="${STACK_ROOT}"         >> "${GITHUB_ENV}"

    - name: ⚙️ Set PKG_CONFIG_PATH for the ICU library (on macOS)
      if: runner.os == 'macOS'
      run: |
        echo PKG_CONFIG_PATH="$(brew --prefix)/opt/icu4c/lib/pkgconfig" >> "${GITHUB_ENV}"

    - name: 📥 Install the icu library (on Windows)
      if: runner.os == 'Windows'
      run: |
        # -Sy refreshes the package database first: the GH Windows runner
        # image ships a bundled MSYS2 db snapshot that can reference
        # package versions mirrors have since pruned, causing "failed
        # retrieving file ... 404" across every configured mirror despite
        # the requested packages being entirely unversioned here.
        #
        # mingw64, not clang64: with system-ghc: true, Cabal's configure
        # step (via Stack) hardcodes --extra-include-dirs/--extra-lib-dirs
        # pointing at Stack's bundled msys2/mingw64 tree regardless of
        # which MSYS2 subsystem we install into, so the packages actually
        # used by the linker must live under mingw64, not clang64.
        stack exec $STACK_YAML_ARG -- pacman -Sy --noconfirm
        stack exec $STACK_YAML_ARG -- pacman -S --noconfirm mingw-w64-x86_64-icu mingw-w64-x86_64-pkgconf

    - name: 🛣️ Add MSYS2 mingw64 bin to PATH (on Windows)
      if: runner.os == 'Windows'
      run: |
        stack path $STACK_YAML_ARG --extra-library-dirs | tr ',' '\n' | grep -i 'bin$' | sed 's/^ *//' >> "${GITHUB_PATH}"

    - name: 🎛️ Resolve ICU version
      env:
        RUNNER_OS: ${{ runner.os }}
      run: bash .github/scripts/resolve-icu-version.sh

    # Includes the workflow file itself so a change to the dependency-build
    # commands/flags (not just the project files below) also busts the
    # cache, instead of silently reusing a build produced by different
    # commands. Coarser than hashing just the relevant steps, but needs no
    # separate script to keep in sync.
    #
    # DEPS_FINGERPRINT: only package.yaml's dependency-affecting content --
    # every 'dependencies:' list, wherever nested under flag/arch 'when:'
    # conditions -- extracted structurally via yq rather than hashing the
    # whole file, so the package's own version or an unrelated ghc-options
    # change (e.g. dropping -with-rtsopts) doesn't bust this cache. Mirrors
    # the identical fix applied to the WASM dist-newstyle cache key.
    # agda-language-server.cabal is intentionally not hashed: check-cabal-
    # drift guarantees it's always an exact mechanical regeneration of
    # package.yaml, so hashing both would be redundant.
    - name: 🎛️ Compute compiled-dependency CONFIG_HASH
      run: |
        DEPS_FINGERPRINT=$(yq -o=json '[.. | select(has("dependencies")) | .dependencies]' package.yaml | sha256sum | cut -d' ' -f1)
        echo CONFIG_HASH="${{ hashFiles(env.STACK_YAML, format('{0}.lock', env.STACK_YAML), '.github/workflows/test.yaml') }}-${DEPS_FINGERPRINT}" >> "${GITHUB_ENV}"

    - name: 🔍 Review all variables
      run: |
        echo "STACK_YAML      = ${STACK_YAML}"
        echo "STACK_YAML_ARG  = ${STACK_YAML_ARG}"
        echo "STACK_RESOLVER  = ${STACK_RESOLVER}"
        echo "ARTEFACT        = ${ARTEFACT}"
        echo "GHC_VERSION     = ${GHC_VERSION}"
        echo "STACK_VERSION   = ${STACK_VERSION}"
        echo "ICU_VERSION     = ${ICU_VERSION}"
        echo "STACK_ROOT      = ${STACK_ROOT}"
        echo "CONFIG_HASH     = ${CONFIG_HASH}"

    - name: 💾 Restore compiled-dependency cache
      id: stack-snapshot
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.STACK_ROOT }}/snapshots
          ${{ env.STACK_ROOT }}/setup-exe-cache
        key: stack-snapshot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ env.GHC_VERSION }}-${{ env.ICU_VERSION }}-${{ env.STACK_RESOLVER }}-${{ matrix.agda }}-${{ env.CONFIG_HASH }}
        restore-keys: |
          stack-snapshot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ env.GHC_VERSION }}-${{ env.ICU_VERSION }}-${{ env.STACK_RESOLVER }}-${{ matrix.agda }}-

    - name: 📸 Build Snapshot
      run: stack build $STACK_YAML_ARG --no-terminal --only-snapshot -j1

    - name: 🏗️ Build Dependencies
      id: build-deps
      run: stack build $STACK_YAML_ARG --no-terminal --only-dependencies

    - name: 🏗️ Build Testings
      id: build-test-deps
      run: stack build $STACK_YAML_ARG --test --no-terminal --only-dependencies

    # Cache save point: both dependency-producing steps above must have
    # succeeded, and only the designated writer(s) may save a key shared
    # by more than one matrix entry. A later ALS build or test failure
    # must not invalidate an already-saved compiled-dependency cache.
    # (The macOS toolchain cache is saved earlier, right after Haskell
    # setup and version verification -- see above.)

    - name: 💾 Save compiled-dependency cache
      if: >
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.build-deps.outcome == 'success' && steps.build-test-deps.outcome == 'success' &&
        steps.stack-snapshot.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.STACK_ROOT }}/snapshots
          ${{ env.STACK_ROOT }}/setup-exe-cache
        key: stack-snapshot-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.STACK_VERSION }}-${{ env.GHC_VERSION }}-${{ env.ICU_VERSION }}-${{ env.STACK_RESOLVER }}-${{ matrix.agda }}-${{ env.CONFIG_HASH }}

    - name: 🏗️ Build ALS
      run: stack build $STACK_YAML_ARG

    - name: 📦 Bundle executable, DLLs and data files (on macOS)
      if: runner.os == 'macOS'
      run: |  # Bundle icu4c DLLs

        # see if icu4c has been installed
        if [ "$(brew list | grep icu4c)" = "" ]
            then
                echo "installing icu4c"
                brew install icu4c
        fi

        # get the directory of the DDLs we want (icuuc, icui18n, icudata)
        dylib_dir=$(dirname "$(brew list icu4c | grep icuuc.dylib)")
        echo "dylib_dir: $dylib_dir"

        # find the path of "als"
        executable=$(find "$(stack path $STACK_YAML_ARG --local-install-root)"/bin -name "als")
        echo "executable: $executable"

        # remove the old dylib, and make a new one
        rm -rf dylib
        mkdir dylib

        ################################################################################
        # icuuc
        ################################################################################

        icuuc_id=$(otool -L "$executable" | grep icuuc | awk '{print $1}')
        icuuc_id_basename=$(basename "$icuuc_id")

        icuuc_path=$dylib_dir/$icuuc_id_basename
        icuuc_path_new=dylib/$icuuc_id_basename
        icuuc_id_new=@loader_path/dylib/$icuuc_id_basename

        # copy icuuc to the new directory
        cp "$icuuc_path" "$icuuc_path_new"

        # change icuuc's ID referenced by ALS
        install_name_tool -change "$icuuc_id" "$icuuc_id_new" "$executable"

        echo "icuuc referenced by ALS"
        echo "    old ID  : $icuuc_id"
        echo "    new ID  : $icuuc_id_new"
        echo "    old path: $icuuc_path"
        echo "    new path: $icuuc_path_new"

        ################################################################################
        # icui18n
        ################################################################################

        icui18n_id=$(otool -L "$executable" | grep icui18n | awk '{print $1}')
        icui18n_id_basename=$(basename "$icui18n_id")

        icui18n_path=$dylib_dir/$icui18n_id_basename
        icui18n_path_new=dylib/$icui18n_id_basename
        icui18n_id_new=@loader_path/dylib/$icui18n_id_basename

        # copy icui18n to the new directory
        cp "$icui18n_path" "$icui18n_path_new"

        # change icui18n's ID referenced by ALS
        install_name_tool -change "$icui18n_id" "$icui18n_id_new" "$executable"

        echo "icui18n referenced by ALS"
        echo "    old ID  : $icui18n_id"
        echo "    new ID  : $icui18n_id_new"
        echo "    old path: $icui18n_path"
        echo "    new path: $icui18n_path_new"

        ################################################################################
        # icudata
        ################################################################################

        # otool -L "$icui18n_id" | grep icudata | awk '{print $1}'
        icudata_id=$(otool -L "$icuuc_path" | grep icudata | awk '{print $1}')
        icudata_id_basename=$(basename "$icudata_id")

        icudata_path=$dylib_dir/$icudata_id_basename
        icudata_path_new=dylib/$icudata_id_basename

        # copy icudata to the new directory
        cp "$icudata_path" "$icudata_path_new"

        # no need of changing the ID because supposely it's already of "@loader_path"

        echo "icudata referenced by icuuc"
        echo "    old ID    : $icudata_id"
        echo "    old path  : $icudata_path"
        echo "    new path  : $icudata_path_new"

    - name: 📦 Bundle ICU libraries (on Linux)
      if: runner.os == 'Linux'
      run: |
        command -v patchelf >/dev/null 2>&1 || sudo apt-get install -y patchelf

        executable=$(find "$(stack path $STACK_YAML_ARG --local-install-root)/bin" -name "als")
        echo "executable: $executable"

        rm -rf lib
        mkdir lib

        for name in libicuuc libicui18n libicudata; do
          entry=$(ldd "$executable" | grep "${name}\.so" || true)
          if [[ -z "$entry" ]]; then
            echo "::error::could not find $name in ldd output for $executable"
            exit 1
          fi
          soname=$(echo "$entry" | awk '{print $1}')
          real_path=$(readlink -f "$(echo "$entry" | awk '{print $3}')")
          cp "$real_path" "lib/$soname"
          echo "bundled $soname (from $real_path)"
        done

        # $ORIGIN is a dynamic-linker token (the directory containing
        # the executable at run time), not a shell variable -- must
        # stay unexpanded here.
        patchelf --set-rpath '$ORIGIN/lib' "$executable"
        echo "rpath set on $executable: $(patchelf --print-rpath "$executable")"

    - name: 📦 Bundle executable, DLLs and data files (on Linux and macOS)
      if: runner.os != 'Windows'
      id: zip
      run: |
        # locate the data-dir
        datadir=$(find "$(stack path $STACK_YAML_ARG --snapshot-install-root)/share" -type d -name "Agda-*")
        echo "datadir: $datadir"

        # locate the executable
        executable=$(find "$(stack path $STACK_YAML_ARG --local-install-root)/bin" -name "als")
        echo "executable: $executable"

        # make a temporary directory for compresssing
        mkdir zip
        cp -r "$datadir" zip/data
        if [[ ${{ runner.os }} == "macOS" ]]; then
            cp -r dylib zip/dylib
        fi
        if [[ ${{ runner.os }} == "Linux" ]]; then
            cp -r lib zip/lib
        fi
        cp "$executable" zip/

        # compress
        cd zip
        zip -r $ARTEFACT.zip ./*
        cd ..
        mv zip/$ARTEFACT.zip .
        

    - name: 📦 Bundle executable, DLLs and data files (on Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # locate the data-dir
        $snapshot = (stack path $STACK_YAML_ARG --snapshot-install-root)
        $datadir = (ls $snapshot\share *Agda-* -Recurse -Directory).FullName

        # locate the executable
        $local = (stack path $STACK_YAML_ARG --local-install-root)
        $executable = (ls $local\bin *als.exe* -Recurse -File).FullName

        # make a temporary directory for compresssing
        mkdir zip
        cp -r $datadir zip/data
        cp $executable zip/

        # include text-icu DLLs
        $mingw64bin = (stack path $STACK_YAML_ARG --extra-library-dirs).split(", ") -match "\\bin"
        cp (ls $mingw64bin *libicudt*) zip/
        cp (ls $mingw64bin *libicuin*) zip/
        cp (ls $mingw64bin *libicuuc*) zip/
        ls zip

        # compress
        cd zip
        Compress-Archive * "$($env:ARTEFACT).zip"
        cd ..
        mv zip/"$($env:ARTEFACT).zip" .
  
    - name: 🧪 Run tests
      run: |
        stack test $STACK_YAML_ARG

        # Re-run the Smoke tests against the zipped release artifact,
        # not the in-place build, to catch packaging bugs like #6.
        rm -rf release
        mkdir release
        unzip -o -q "$ARTEFACT.zip" -d release
        als="$PWD/release/als"
        [[ "${{ runner.os }}" == "Windows" ]] && als="$PWD/release/als.exe"

        test_bin="$(stack path $STACK_YAML_ARG --dist-dir)/build/als-test/als-test"
        [[ "${{ runner.os }}" == "Windows" ]] && test_bin="${test_bin}.exe"
        "$test_bin" --als-path="$als" --pattern Smoke

        if [[ "${{ runner.os }}" == "Linux" ]]; then
          # Verify the fix for #6: the bundled ICU libs let 'als' run
          # even when the system's ICU is hidden.
          bash .github/scripts/check-artifact-runs.sh "$als" --hide-icu
        fi

    - name: 📤 Upload native artifact
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTEFACT }}
        path: ${{ env.ARTEFACT }}.zip
        if-no-files-found: error
        retention-days: 7

  build-wasm:
    name: Build WASM
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        agda:
        - { name: '2.8.0', label: 'Agda-2.8.0', flag: '2-8-0', commit: 'e2f8c69414fa115328280ecc4de1d2b7a23be7fa' }
        - { name: '2.7.0.1', label: 'Agda-2.7.0.1', flag: '2-7-0', commit: '702c924fdab93aa8992adca84e72a91c490f7b1b' }
        - { name: '2.6.4.3', label: 'Agda-2.6.4.3', flag: '2-6-4', commit: '8f35851954c39dc3849095bfd018bed9bd1b32ad' }
      fail-fast: false
    
    env:
      GHC_WASM_META_FLAVOUR: '9.10'
      GHC_WASM_META_COMMIT_HASH: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ALEX_VERSION: '3.5.0.0'
      HAPPY_VERSION: '1.20.1.1'

    steps:
    - uses: actions/checkout@v4
      with:
        path: als
        submodules: true

    - name: Compute cache key
      run: |
        echo "CI_CACHE_KEY=${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_META_COMMIT_HASH }}-flavor-${{ env.GHC_WASM_META_FLAVOUR }}" >> "$GITHUB_ENV"
        if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
          PREFIX="als-dev"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          PREFIX="als-${{ github.ref_name }}"
        else
          PREFIX="als"
        fi
        echo "WASM_ASSET_BASENAME=${PREFIX}-${{ matrix.agda.label }}-wasm" >> "$GITHUB_ENV"

    # Redesigned WASM caching: see wasm.yaml, which this mirrors, for the
    # full rationale. Both are Agda-2.8.0-writes, exact-match-only caches
    # saved immediately after their own producer succeeds.

    - name: Compute WASM toolchain cache key
      run: |
        HASH=$(printf '%s' "v1-${GHC_WASM_META_COMMIT_HASH}-${GHC_WASM_META_FLAVOUR}" | sha256sum | cut -d' ' -f1)
        echo "WASM_TOOLCHAIN_KEY=ghc-wasm-v3-${{ runner.os }}-${{ runner.arch }}-${HASH}" >> "$GITHUB_ENV"

    - name: Restore ghc-wasm-meta toolchain cache
      id: ghc-wasm-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.ghc-wasm
        key: ${{ env.WASM_TOOLCHAIN_KEY }}

    - name: Clone and setup ghc-wasm-meta
      id: ghc-wasm-setup
      if: steps.ghc-wasm-cache-restore.outputs.cache-hit != 'true'
      run: |
        mkdir ghc-wasm-meta
        cd ghc-wasm-meta
        git config --global init.defaultBranch dontcare
        git config --global advice.detachedHead false
        git init
        git remote add origin https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta.git
        git fetch origin ${{ env.GHC_WASM_META_COMMIT_HASH }} --depth=1
        git checkout FETCH_HEAD
        FLAVOUR=${{ env.GHC_WASM_META_FLAVOUR }} ./setup.sh

    - name: Add ghc-wasm-meta to PATH
      run: ~/.ghc-wasm/add_to_github_path.sh

    - name: Validate ghc-wasm-meta toolchain executables
      if: steps.ghc-wasm-cache-restore.outputs.cache-hit != 'true'
      id: validate-wasm-toolchain
      run: bash "$GITHUB_WORKSPACE/als/.github/scripts/validate-wasm-toolchain.sh"

    - name: Cache ghc-wasm-meta (Agda 2.8.0 is the sole writer)
      if: >
        matrix.agda.name == '2.8.0' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.ghc-wasm-cache-restore.outputs.cache-hit != 'true' &&
        steps.validate-wasm-toolchain.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ~/.ghc-wasm
        key: ${{ env.WASM_TOOLCHAIN_KEY }}

    - name: Update wasm32 cabal
      run: wasm32-wasi-cabal update

    # Producer identity: the key previously hashed only Cabal's version,
    # never GHC's, despite GHC being what actually compiles alex/happy.
    # GHC's resolved path is exported so the install step below can select
    # it explicitly via --with-compiler, guaranteeing the version hashed
    # here is the compiler actually used.
    - name: Compute native-utilities cache key
      run: |
        GHC_BIN="$(command -v ghc)"
        GHC_VERSION="$(ghc --numeric-version)"
        CABAL_VERSION="$(~/.ghc-wasm/cabal/bin/cabal --numeric-version)"
        echo "HOST_GHC_BIN=${GHC_BIN}" >> "$GITHUB_ENV"
        HASH=$(printf '%s' "v2-${GHC_VERSION}-${CABAL_VERSION}-${ALEX_VERSION}-${HAPPY_VERSION}" | sha256sum | cut -d' ' -f1)
        echo "NATIVE_UTILS_KEY=native-tools-v7-${{ runner.os }}-${{ runner.arch }}-${HASH}" >> "$GITHUB_ENV"

    - name: Restore native-utilities cache
      id: native-utils-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.native-utils
        key: ${{ env.NATIVE_UTILS_KEY }}

    # alex/happy embed an absolute --datadir path at build time (read via
    # Paths_alex/Paths_happy, which check the alex_datadir/happy_datadir
    # env vars before falling back to that baked-in path). `cabal install
    # --install-method=copy` only relocates the executable, not the data
    # directory it depends on at runtime, so a binary restored from cache
    # on a fresh runner points at a Cabal store entry that was never
    # installed there. Pointing these env vars at a copy of the data
    # directory that lives inside the cached payload itself makes the
    # payload actually self-contained, on both the cache-hit and
    # cache-miss paths.
    - name: Set native-utilities datadir env vars
      run: |
        echo "alex_datadir=$HOME/.native-utils/share/alex-${ALEX_VERSION}" >> "$GITHUB_ENV"
        echo "happy_datadir=$HOME/.native-utils/share/happy-${HAPPY_VERSION}" >> "$GITHUB_ENV"

    - name: Add native-utilities dir to PATH (exact hit)
      if: steps.native-utils-cache-restore.outputs.cache-hit == 'true'
      run: echo "$HOME/.native-utils" >> "$GITHUB_PATH"

    - name: Validate restored native utilities (exact hit)
      if: steps.native-utils-cache-restore.outputs.cache-hit == 'true'
      run: bash "$GITHUB_WORKSPACE/als/.github/scripts/validate-native-utils.sh"

    - name: Install native utilities (exact miss)
      if: steps.native-utils-cache-restore.outputs.cache-hit != 'true'
      id: install-native-utils
      run: |
        echo ">>> Update cabal"
        ~/.ghc-wasm/cabal/bin/cabal update
        echo ">>> Install alex and happy"
        mkdir -p ~/.native-utils
        ~/.ghc-wasm/cabal/bin/cabal install \
          --with-compiler="$HOST_GHC_BIN" \
          --installdir="$HOME/.native-utils" --install-method=copy --overwrite-policy=always \
          "alex-${ALEX_VERSION}" "happy-${HAPPY_VERSION}"
        echo "$HOME/.native-utils" >> "$GITHUB_PATH"

        echo ">>> Copy alex/happy datadirs into the cached payload"
        mkdir -p "${alex_datadir}" "${happy_datadir}"
        alex_store_share="$(find "$HOME/.local/state/cabal/store" -type d -path "*/alex-${ALEX_VERSION}-*/share" | head -1)"
        happy_store_share="$(find "$HOME/.local/state/cabal/store" -type d -path "*/happy-${HAPPY_VERSION}-*/share" | head -1)"
        [ -n "${alex_store_share}" ] || { echo "::error::could not locate alex's installed share directory" >&2; exit 1; }
        [ -n "${happy_store_share}" ] || { echo "::error::could not locate happy's installed share directory" >&2; exit 1; }
        cp -R "${alex_store_share}/." "${alex_datadir}/"
        cp -R "${happy_store_share}/." "${happy_datadir}/"

    - name: Validate installed native utilities (after install)
      if: steps.install-native-utils.outcome == 'success'
      run: bash "$GITHUB_WORKSPACE/als/.github/scripts/validate-native-utils.sh"

    - name: Cache native utilities (Agda 2.8.0 is the sole writer)
      if: >
        matrix.agda.name == '2.8.0' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.native-utils-cache-restore.outputs.cache-hit != 'true' &&
        steps.install-native-utils.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ~/.native-utils
        key: ${{ env.NATIVE_UTILS_KEY }}

    - name: Checkout Agda submodule at v${{ matrix.agda.name }}
      run: |
        cd als/wasm-submodules/agda
        git fetch --depth 1 origin "${{ matrix.agda.commit }}"
        git checkout FETCH_HEAD
        echo "AGDA_WASM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Resolve network submodule revision
      run: echo "NETWORK_SUBMODULE_COMMIT=$(git -C als/wasm-submodules/network rev-parse HEAD)" >> "$GITHUB_ENV"

    # Downstream propagation: a gitlink-only bump of the network submodule
    # doesn't change the text of any file hashFiles() can see, so it's
    # resolved and hashed explicitly. The WASM toolchain and native-utils
    # producer hashes are folded in too (summarized via sha256 to stay
    # under the cache-key length limit), so a compiler or tool-installation
    # change also invalidates this downstream build.
    #
    # DEPS_FINGERPRINT: only package.yaml's dependency-affecting content --
    # every 'dependencies:' list, wherever nested under flag/arch 'when:'
    # conditions -- extracted structurally via yq rather than hashing the
    # whole file. This job only ever runs 'cabal build lib:agda' and
    # 'cabal build --dependencies-only', neither of which is affected by
    # the package's own version, metadata, or ghc-options (e.g. dropping
    # -with-rtsopts), so those must not invalidate this cache; a version
    # bump previously did (~55-60 min of unnecessary rebuild). Hashing
    # package.yaml rather than the generated agda-language-server.cabal
    # relies on check-cabal-drift guaranteeing they're always identical.
    # cabal.project.wasm32 is still hashed in full: every line in it
    # (index-state, constraints, packages, source-repository-package
    # pins) is dependency-relevant.
    - name: Compute dist-newstyle cache key
      id: dist-newstyle-cache-key
      run: |
        PRODUCER_HASH=$(printf '%s' "${{ env.WASM_TOOLCHAIN_KEY }}-${{ env.NATIVE_UTILS_KEY }}" | sha256sum | cut -d' ' -f1)
        DEPS_FINGERPRINT=$(yq -o=json '[.. | select(has("dependencies")) | .dependencies]' als/package.yaml | sha256sum | cut -d' ' -f1)
        echo "key=dist-newstyle-v3-${{ env.CI_CACHE_KEY }}-agda-${{ env.AGDA_WASM_COMMIT }}-net-${{ env.NETWORK_SUBMODULE_COMMIT }}-producers-${PRODUCER_HASH}-${{ hashFiles('als/cabal.project.wasm32') }}-${DEPS_FINGERPRINT}" >> "$GITHUB_OUTPUT"

    - name: Restore dist-newstyle cache for resolved Agda revision
      id: dist-newstyle-cache-restore-resolved
      uses: actions/cache/restore@v4
      with:
        path: als/dist-newstyle
        key: ${{ steps.dist-newstyle-cache-key.outputs.key }}

    # Cabal global package store (step 7 finding): 'wasm32-wasi-cabal path'
    # reports store-dir as ~/.ghc-wasm/.cabal/store -- inside the toolchain
    # payload, but populated only by the dependency builds below, which run
    # after the toolchain cache (see 'Cache ghc-wasm-meta' above) has
    # already been saved. So the toolchain cache never captures it, and
    # every third-party Hackage dependency was being rebuilt from scratch
    # on every run regardless of the dist-newstyle cache's hit/miss state.
    # Unlike dist-newstyle, the store is content-addressed (entries keyed
    # by package/version/flags/ABI), so it's safe to share across all 3
    # Agda matrix entries and to fall back to a stale prefix match -- a
    # miss on newer inputs just adds entries rather than ever serving a
    # wrong one. Keyed by WASM_TOOLCHAIN_KEY (not CI_CACHE_KEY, which
    # embeds the Agda version) so the same cache serves every matrix entry.
    - name: Compute cabal store cache key
      working-directory: './als'
      run: |
        DEPS_FINGERPRINT=$(yq -o=json '[.. | select(has("dependencies")) | .dependencies]' package.yaml | sha256sum | cut -d' ' -f1)
        echo "CABAL_STORE_KEY=cabal-store-v1-${{ env.WASM_TOOLCHAIN_KEY }}-${{ hashFiles('als/cabal.project.wasm32') }}-${DEPS_FINGERPRINT}" >> "$GITHUB_ENV"

    - name: Restore cabal global store cache
      id: cabal-store-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.ghc-wasm/.cabal/store
        key: ${{ env.CABAL_STORE_KEY }}
        restore-keys: |
          cabal-store-v1-${{ env.WASM_TOOLCHAIN_KEY }}-

    - name: 📋 Cache summary
      run: |
        {
          echo "### Cache summary (${{ matrix.agda.name }}, ${{ runner.os }}/${{ runner.arch }})"
          echo "| cache | hit | key |"
          echo "|---|---|---|"
          echo "| toolchain | ${{ steps.ghc-wasm-cache-restore.outputs.cache-hit || 'false' }} | \`${{ env.WASM_TOOLCHAIN_KEY }}\` |"
          echo "| native-utils | ${{ steps.native-utils-cache-restore.outputs.cache-hit || 'false' }} | \`${{ env.NATIVE_UTILS_KEY }}\` |"
          echo "| cabal-store | ${{ steps.cabal-store-cache-restore.outputs.cache-hit || 'false' }} | \`${{ env.CABAL_STORE_KEY }}\` |"
          echo "| dist-newstyle | ${{ steps.dist-newstyle-cache-restore-resolved.outputs.cache-hit || 'false' }} | \`${{ steps.dist-newstyle-cache-key.outputs.key }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cabal configure
      working-directory: './als'
      run: |
        mv cabal.project.wasm32 cabal.project
        wasm32-wasi-cabal configure --flag=Agda-${{ matrix.agda.flag }}

    - name: Build Agda as dependency
      id: build-dep-agda
      working-directory: './als'
      run: wasm32-wasi-cabal build lib:agda

    - name: Build dependencies other than Agda
      id: build-deps-other-than-agda
      working-directory: './als'
      run: |
        # Setup network submodule autotools
        cd wasm-submodules/network
        autoreconf -i
        cd ../..
        # Build all dependencies (cabal git deps + network submodule)
        wasm32-wasi-cabal build --dependencies-only

    - name: Cache dist-newstyle
      uses: actions/cache/save@v4
      if: >
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.build-deps-other-than-agda.outcome == 'success'
      with:
        path: als/dist-newstyle
        key: ${{ steps.dist-newstyle-cache-key.outputs.key }}

    - name: Save cabal global store cache (Agda 2.8.0 is the sole writer)
      if: >
        matrix.agda.name == '2.8.0' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        steps.cabal-store-cache-restore.outputs.cache-hit != 'true' &&
        steps.build-deps-other-than-agda.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ~/.ghc-wasm/.cabal/store
        key: ${{ env.CABAL_STORE_KEY }}

    - name: Build als
      working-directory: './als'
      run: |
        mkdir ~/out
        wasm32-wasi-cabal build
        WASM_BINARY_PATH=$(wasm32-wasi-cabal list-bin als)
        cp "$WASM_BINARY_PATH" ~/out/${WASM_ASSET_BASENAME}.wasm
        echo "WASM_BINARY_NAME=${WASM_ASSET_BASENAME}.wasm" >> $GITHUB_ENV

    - name: 📤 Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.WASM_ASSET_BASENAME }}
        path: ~/out/${{ env.WASM_BINARY_NAME }}
        if-no-files-found: error
        retention-days: 7

  create-release:
    name: Create Release
    needs: [check-cabal-drift, build-and-test, build-wasm]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🏭 Create Stable Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        gh release create ${{ github.ref_name }} --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🚢 Create/Update Dev Release
      if: github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete existing dev release if it exists
        gh release delete dev --cleanup-tag -y || true

        # Wait for GitHub to process the deletion to avoid race condition
        # that causes releases to be created as drafts
        # See: https://github.com/cli/cli/issues/8458
        sleep 5

        # Create new dev pre-release
        gh release create dev \
          --title "Development Release (dev)" \
          --notes "Development pre-release build from latest changes. This is a pre-release for testing purposes." \
          --prerelease

  upload-stable-release:
    name: Upload to Stable Release
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 🚢 Upload artifacts to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd artifacts
        for dir in */; do
          artifact_name="${dir%/}"
          echo "Uploading ${artifact_name}..."
          if [ -f "${artifact_name}/${artifact_name}.zip" ]; then
            gh release upload ${{ github.ref_name }} "${artifact_name}/${artifact_name}.zip" --clobber --repo ${{ github.repository }}
          else
            artifact_file=$(find "${artifact_name}" -maxdepth 1 -type f | head -1)
            if [ -n "$artifact_file" ]; then
              gh release upload ${{ github.ref_name }} "$artifact_file" --clobber --repo ${{ github.repository }}
            else
              echo "Warning: No uploadable file found in ${artifact_name}"
            fi
          fi
        done

  upload-dev-release:
    name: Upload to Dev Release
    needs: create-release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: 🚢 Upload artifacts to dev release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd artifacts
        for dir in */; do
          artifact_name="${dir%/}"
          echo "Uploading ${artifact_name}..."
          if [ -f "${artifact_name}/${artifact_name}.zip" ]; then
            gh release upload dev "${artifact_name}/${artifact_name}.zip" --clobber --repo ${{ github.repository }}
          else
            artifact_file=$(find "${artifact_name}" -maxdepth 1 -type f | head -1)
            if [ -n "$artifact_file" ]; then
              gh release upload dev "$artifact_file" --clobber --repo ${{ github.repository }}
            else
              echo "Warning: No uploadable file found in ${artifact_name}"
            fi
          fi
        done
