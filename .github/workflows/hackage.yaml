name: Hackage Release

on:
  workflow_dispatch:

concurrency:
  group: hackage-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Hackage
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🏗 Setup Haskell
      uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
      with:
        ghc-version: '9.10.2'
        cabal-version: '3.12.1.0'

    - name: 📦 Build source distribution
      run: cabal sdist

    - name: 🚀 Upload candidate to Hackage
      env:
        HACKAGE_API_KEY: ${{ secrets.HACKAGE_API_KEY }}
      run: |
        TARBALL=$(find dist-newstyle/sdist -name '*.tar.gz')
        echo "Uploading ${TARBALL} as a Hackage candidate"
        cabal upload --token="${HACKAGE_API_KEY}" "${TARBALL}"
